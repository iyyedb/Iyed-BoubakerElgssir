<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex2</title>
</head>
<body>
    <table border="5">
        <tr>
            <td><label for="psd">Votre pseudo : </label></td>
            <td><input type="text" name="psd" id="psd"> <br></td>
        </tr>
        <tr>
            <td><label for="">Votre mot de passe : </label></td>
            <td><input type="text" name="mdp" id="mdp"> <br></td>
        </tr>
        <tr>
            <td><label for="">Resassir votre mot de passe : </label></td>
            <td><input type="text" name="rmdp" id="rmdp"> <br></td>
        </tr>
        <tr>
            <td rowspan="6"><label for="radio">OS préféré : </label></td>
        <tr>
            <td><input type="radio" name="xp" id="xp">Windows XP</td>
        </tr>
        <tr>
            <td><input type="radio" name="wv" id="wv">Windows Vista</td>
        </tr>
        <tr>
            <td><input type="radio" name="mac" id="mac">MacOSX</td>
        </tr>
        <tr>
            <td><input type="radio" name="lnx" id="lnx">Linux</td>
        </tr>
        <tr>
            <td><input type="radio" name="au" id="au">Autres</td>
        </tr>
        <tr>
            <td rowspan="5"><label for="">Vous possédez : </label></td>
        </tr>
        <tr>
            <td><input type="checkbox" name="bu" id="bu">Un ordinateur de bureau</td>
        </tr>
        <tr>
            <td><input type="checkbox" name="pt" id="pt">Un portable</td>
        </tr>
        <tr>
            <td><input type="checkbox" name="nb" id="nb">Un netbook</td>
        </tr>
        <tr>
            <td><input type="checkbox" name="pad" id="pad">Un tablette (Pad)</td>
        </tr>
        <tr>
            <td><label for="">Votre profession : </label></td>
            <td><select name="" id="">
                <option value="0">Chomeur</option>
                <option value="1">Etudiant</option>
                <option value="2">Fonctionnaire</option>
                <option value="3">Privé</option>
            </select></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="button" name="ins" id="ins" value="S'inscrire"></td>
        </tr>
    </table>
</body>
</html>
